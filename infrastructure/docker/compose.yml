services:
  postgres:
    image: postgres:16-alpine
    container_name: compass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: compass
    ports:
      - "5432:5432"
    volumes:
      - compass-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d compass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  compass-postgres-data:
